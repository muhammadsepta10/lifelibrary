  Pertanyaan: gaya visual & struktur layar mana yang paling cocok untuk lifelibrary?
  Tiga variant (A/B/C) dari 3 layar inti (Beranda, Sesi Penerimaan, Detail Buku),
  dipilih lewat ?variant=A|B|C, bar mengambang di bawah, atau tombol panah ← →.

-->

  /* =========================================================
     VARIANT A — Kertas & Tinta (sesuai docs/research/ui-ux.md)

     ========================================================= */
  .vA { background: #FAF6EE; color: #2B2620; font-family: Inter; }

  .vB { background: #F3EEE4; color: #1E2420; font-family: Inter; }

  .vB .fnav .act { color: #F3EEE4; }
  .vB .fnav .fab { width: 64px; height: 64px; border-radius: 50%; background: #E76F51; color: #fff; display: flex; align-items: center; justify-content: center; margin-top: -30px; box-shadow: 0 8px 20px rgba(231,111,81,.5); border: 4px solid #F3EEE4; }
  .vB .fnav .fab svg { width: 26px; height: 26px; }

  .vB .camtop { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; font-size: 14px; }

  .vB .cta { margin: 0 20px; height: 52px; border-radius: 16px; background: #1F3A33; color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }

  /* =========================================================
     VARIANT C — Kartu Katalog

     ========================================================= */
  .vC { background: #ECE6D8; color: #232019; font-family: 'Source Serif 4', serif; }

/* =================== VARIANT C =================== */
const C = {

/* ---------- switcher ---------- */
const variants = { A, B, C };
const keys = Object.keys(variants);
const params = new URLSearchParams(location.search);
let cur = keys.includes(params.get('variant')) ? params.get('variant') : 'A';
offline = params.get('offline') === '1';

function render() {
  const v = variants[cur];
  const screens = [['Beranda', v.beranda()], ['Sesi Penerimaan (scan)', v.scan()], ['Detail Buku', v.detail()]];
  document.getElementById('screens').innerHTML = screens.map(([l, h]) =>
    `<section><div class="screen-label">${l}</div><div class="phone v${cur}">${h}</div></section>`).join('');
  document.getElementById('stageTitle').innerHTML = `PROTOTYPE · lifelibrary · <b>${cur} — ${v.name}</b>${offline ? ' · keadaan offline' : ''}`;
  document.getElementById('lbl').textContent = `${cur} (${v.name})`;
  document.getElementById('off').classList.toggle('on', offline);
  const p = new URLSearchParams(location.search);
  p.set('variant', cur); offline ? p.set('offline', '1') : p.delete('offline');
  history.replaceState(null, '', `?${p}`);
  lucide.createIcons();
}
const step = (d) => { cur = keys[(keys.indexOf(cur) + d + keys.length) % keys.length]; render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('off').onclick = () => { offline = !offline; render(); };
addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
render();
</script>
